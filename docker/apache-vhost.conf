<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /app/backend/public

    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /app/backend/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On

        # API and Laravel health requests must reach Laravel; all other unknown
        # paths are React routes and must load the SPA entry point.
        RewriteCond %{REQUEST_URI} ^/(api|up)(/|$) [NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]

        # At the document root Apache would otherwise select Laravel's
        # index.php as DirectoryIndex. The public home must be the React SPA.
        RewriteRule ^$ /index.html [L]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
