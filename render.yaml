services:
  - type: web
    name: ai-smart-campus-system
    runtime: docker
    # A paid web plan is required for an always-on public demo. Database is external managed MySQL.
    plan: starter
    branch: main
    # Deploy only after the production database and secrets have been reviewed.
    autoDeployTrigger: off
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        # Preserve the current production key; provide it as a dashboard secret.
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_TLS_CHECK_ON_START
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        # Aiven MySQL uses its service port, not MySQL's local default.
        # Keep this aligned with the verified Aiven service configuration.
        value: "15419"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: ONLINE_DEMO_SEED_ENABLED
        value: "false"
      - key: ONLINE_DEMO_SEED_CONFIRMATION
        sync: false
