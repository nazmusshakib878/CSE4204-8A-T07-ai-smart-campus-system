name: Docker production smoke test

on:
  push:
    branches: ["main", "verify/render-apache-port", "verify/render-api-fix"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the exact Render image
        run: docker build --tag ai-smart-campus:smoke .

      - name: Start production image on the Render port
        run: |
          docker run --detach --name campus-smoke --publish 10000:10000 \
            --env PORT=10000 \
            --env APP_ENV=testing \
            --env APP_KEY='base64:SmFzP5cUFhO6HlWGAcYjZhrTXVbsqGsxDKv3PRB9mfA=' \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=:memory: \
            --env SESSION_DRIVER=array \
            --env CACHE_STORE=array \
            --env QUEUE_CONNECTION=sync \
            --env LOG_CHANNEL=stderr \
            ai-smart-campus:smoke

      - name: Verify Apache, Laravel, React SPA, assets and API routing
        run: |
          set -euxo pipefail
          trap 'docker logs campus-smoke; docker rm -f campus-smoke || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/up > /tmp/up; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:10000/ > /tmp/home
          grep -q 'id="root"' /tmp/home
          for path in /login /register /admin /admin/users; do
            route_file="/tmp/route-$(echo "$path" | tr '/' '_')"
            curl --fail --silent --show-error "http://127.0.0.1:10000${path}" > "$route_file"
            grep -q 'id="root"' "$route_file"
          done
          asset=$(grep -oE '/assets/[^" ]+\.(js|css)' /tmp/home | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error "http://127.0.0.1:10000${asset}" > /dev/null
          api_status=$(curl --silent --output /tmp/api --write-out '%{http_code}' http://127.0.0.1:10000/api/not-a-real-route)
          echo "API status: $api_status"
          head -c 500 /tmp/api
          echo
          test "$api_status" = 404
          grep -q 'API endpoint not found' /tmp/api
          docker exec campus-smoke apache2ctl -S 2>&1
          docker exec campus-smoke apache2ctl -S 2>&1 | grep -Eq '(:|\*)10000'
          test "$(docker inspect --format '{{.State.Running}}' campus-smoke)" = true
          ! docker logs campus-smoke 2>&1 | grep -E 'AH01276|Cannot serve directory|DirectoryIndex'

      - name: Print logs on failure
        if: failure()
        run: docker logs campus-smoke || true
